# Stack « cyber » — plateforme d'apprentissage et de sensibilisation à la cybersécurité.
#
# Architecture à conteneur unique :
# - Fastify sert l'API et l'application React/Vite compilée
# - Base de données SQLite intégrée sur volume persistant (/data)
# - Authentification passwordless par e-mail (OTP sécurisé à 6 chiffres)
# - E-mails transactionnels soignés (invitations, codes de connexion)
#
# L'image est construite via scripts/deployer.sh ou docker-compose.build.yml.
# Portainer gère la stack via son éditeur Web ou l'API Portainer.

name: cyber

services:
  cyber:
    image: ${CYBER_IMAGE:-cyber:latest}
    container_name: cyber
    restart: unless-stopped
    environment:
      PORT: 3000
      CYBER_DB: /data/cyber.db
      CYBER_URL: ${CYBER_URL:-https://cyber.nico7an.fr}
      CYBER_ADMIN_EMAIL: ${CYBER_ADMIN_EMAIL:-admin@plateforme.local}
      CYBER_DEMO_EMAIL: ${CYBER_DEMO_EMAIL:-admin@demo.local}
      CYBER_COOKIE_SECURISE: ${CYBER_COOKIE_SECURISE:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Europe/Paris
      # Configuration SMTP pour l'envoi des OTP et invitations d'équipe
      SMTP_HOST: ${SMTP_HOST:-ssl0.ovh.net}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_EMAIL: ${SMTP_EMAIL:-no-reply@krateos.fr}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-887LeZbarChibreCouille332--}
      SMTP_FROM: ${SMTP_FROM:-"Cyber <no-reply@krateos.fr>"}
    volumes:
      - /home/nico/Documents/cyber/data:/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.cyber-web.rule=Host(`${CYBER_HOST:-cyber.nico7an.fr}`)"
      - "traefik.http.routers.cyber-web.entrypoints=websecure"
      - "traefik.http.routers.cyber-web.tls.certresolver=myresolver"
      - "traefik.http.routers.cyber-web.middlewares=${CYBER_MIDDLEWARES:-tailscale-whitelist@file}"
      - "traefik.http.services.cyber-web.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
