# Stack « cyber » — plateforme d'apprentissage et de sensibilisation à la cybersécurité.
#
# Architecture à conteneur unique :
# - Fastify sert l'API et l'application React/Vite compilée
# - Base de données SQLite intégrée sur volume persistant
# - Isolation stricte multi-organisations
#
# L'image est construite via scripts/deployer.sh ou docker-compose.build.yml.
# Portainer gère la stack via son éditeur Web ou l'API Portainer.

name: cyber

services:
  cyber:
    image: ${CYBER_IMAGE:-cyber:latest}
    container_name: cyber
    restart: unless-stopped
    environment:
      PORT: 3000
      CYBER_DB: /data/cyber.db
      CYBER_ADMIN_EMAIL: ${CYBER_ADMIN_EMAIL:-admin@plateforme.local}
      CYBER_ADMIN_PASSWORD: ${CYBER_ADMIN_PASSWORD:-ChangeMoi123!}
      CYBER_DEMO_EMAIL: ${CYBER_DEMO_EMAIL:-admin@demo.local}
      CYBER_DEMO_PASSWORD: ${CYBER_DEMO_PASSWORD:-DemoCyber123!}
      CYBER_COOKIE_SECURISE: ${CYBER_COOKIE_SECURISE:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Europe/Paris
    volumes:
      - /home/nico/Documents/cyber/data:/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.cyber.rule=Host(`${CYBER_HOST:-cyber.nico7an.fr}`)"
      - "traefik.http.routers.cyber.entrypoints=websecure"
      - "traefik.http.routers.cyber.tls.certresolver=myresolver"
      - "traefik.http.routers.cyber.middlewares=${CYBER_MIDDLEWARES:-tailscale-whitelist@file}"
      - "traefik.http.services.cyber.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
